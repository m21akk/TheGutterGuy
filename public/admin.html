<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jobs – The Gutter Guy</title>
<link rel="icon" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="admin">

<div id="login" class="login" hidden>
  <form class="card" id="login-form">
    <img src="/assets/logo.png" alt="The Gutter Guy" width="150" style="margin:0 auto 18px">
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="form-error" id="login-error"></div>
    <button class="btn" style="width:100%;justify-content:center">Log in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="a-top">
    <img src="/assets/logo.png" alt="The Gutter Guy" height="40">
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="jobs" class="on">Jobs</button>
      <button role="tab" data-view="diary">Diary</button>
    </nav>
    <button class="link" id="logout">Log out</button>
  </header>

  <main class="a-main">
    <!-- Jobs list -->
    <section id="view-jobs" class="view">
      <div class="filters" id="filters"></div>
      <input type="search" id="search" placeholder="Search name, postcode, phone…" class="search">
      <div id="job-list" class="job-list"></div>
    </section>

    <!-- Diary -->
    <section id="view-diary" class="view" hidden>
      <div class="cal-head">
        <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
        <h2 id="month-label"></h2>
        <button class="icon-btn" id="next" aria-label="Next month">›</button>
        <button class="btn ghost small" id="today">Today</button>
        <button class="btn ghost small" id="subscribe">📅 Add to my phone</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend"><span class="s-new">New</span><span class="s-quoted">Quoted</span><span class="s-paid">Paid</span><span class="s-completed">Done</span></div>
      <div class="day-list" id="day-list"></div>
      <div class="needs-date" id="needs-date"></div>
    </section>
  </main>
</div>

<!-- Job drawer -->
<div class="drawer-bg" id="drawer-bg" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>

<div class="toast" id="toast" hidden></div>

<script src="/assets/admin.js" defer></script>
</body>
</html>
